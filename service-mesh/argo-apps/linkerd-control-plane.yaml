  source:
    chart: linkerd-control-plane
    repoURL: https://helm.linkerd.io/stable
    targetRevision: 1.9.0
    helm:
      parameters:
      - name: identityTrustAnchorsPEM
        value: |
          -----BEGIN CERTIFICATE-----
          MIIBjTCCATOgAwIBAgIQGZXFVK69F7ChoL1RDEmUvzAKBggqhkjOPQQDAjAlMSMw
          IQYDVQQDExpyb290LmxpbmtlcmQuY2x1c3Rlci5sb2NhbDAeFw0yNjAzMjkwNjA1
          MzBaFw0zMTAzMjgwNjA1MzBaMCUxIzAhBgNVBAMTGnJvb3QubGlua2VyZC5jbHVz
          dGVyLmxvY2FsMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwblcDe5qFwYes24j
          tLAAyszftSkFmsmDLGWOkHBo6ia46IExO7EptANw2raDMaYstOVbXFDrmzjCnRPA
          bjRUtKNFMEMwDgYDVR0PAQH/BAQDAgEGMBIGA1UdEwEB/wQIMAYBAf8CAQEwHQYD
          VR0OBBYEFDng1zmIpGlfIOPS8YTdlu1HiURMMAoGCCqGSM49BAMCA0gAMEUCIFyU
