apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trust-manager
  namespace: argocd
spec:
  project: service-mesh
  source:
    path: service-mesh/charts/trust-manager
    repoURL: https://github.com/leetdx/argocd-application-helm.git
    targetRevision: dev
    helm:
      parameters:
      - name: app.trust.namespace
        value: cert-manager
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - Validate=false
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers:
    - /status
